services:
  - type: web
    name: curaweave-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --timeout 120 --max-requests 1000 --max-requests-jitter 50
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curaweave-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: curaweave-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: curaweave-redis
          type: redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://curaweave.vercel.app
      - key: APP_NAME
        value: CuraWeave
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
